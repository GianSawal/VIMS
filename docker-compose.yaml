# DOLE VRS for Coolify. Set the domain on the `web` service (port 80); Coolify's proxy adds HTTPS.
# Values marked :? are required; set them in Coolify's Environment Variables, never in git.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SECRET_KEY: ${SECRET_KEY:?set a long random string}
      DATABASE_URL: ${DATABASE_URL:?mysql://USER:PASSWORD@HOST:PORT/vims}
      DEBUG: "False"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?your domain, e.g. vrs.example.gov.ph}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?https://your-domain}
      CORS_ALLOWED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      FRONTEND_URL: ${CSRF_TRUSTED_ORIGINS}
      SECURE_SSL_REDIRECT: ${SECURE_SSL_REDIRECT:-True}
      SECURE_COOKIES: ${SECURE_COOKIES:-True}
      MEDIA_ROOT: /app/media
      MEDIA_ACCEL_REDIRECT: /protected-media/   # nginx sends uploads after Django's permission check
      CACHE_URL: ${CACHE_URL:-dbcache://vrs_cache}   # rate-limit counters shared by all gunicorn workers
      SECURE_HSTS_SECONDS: ${SECURE_HSTS_SECONDS:-31536000}
      MAPS_PROVIDER: ${MAPS_PROVIDER:-locationiq}
      LOCATIONIQ_API_KEY: ${LOCATIONIQ_API_KEY:-}
      GEOAPIFY_API_KEY: ${GEOAPIFY_API_KEY:-}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    # Database reachable and media volume writable. Host header: Django only answers its own domain.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen(u.Request('http://127.0.0.1:8000/api/health/', headers={'Host': os.environ['ALLOWED_HOSTS'].split(',')[0].strip()}), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s   # migrate + seed + collectstatic run before gunicorn starts
    logging:   # Docker keeps at most 5 x 10 MB of console log per container (log rotation)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - media:/srv/media:ro
      - static:/srv/static:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:   # Docker keeps at most 5 x 10 MB of console log per container (log rotation)
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  media:   # uploaded photos and attachments: back this up with the database
  static:
