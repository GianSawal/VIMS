# Headers for the React app's own files (included per location, because a location's add_header replaces the
# server's). API, admin and media responses get theirs from Django. HSTS also comes from Django: a browser applies
# it to the whole host after any HTTPS response.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Map tiles come from openstreetmap.org and the Inter font from Google Fonts; every API call stays on this origin
# (place search and routing are proxied by Django, so no map key reaches the browser).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
