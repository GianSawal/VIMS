# One origin for the SPA and the API, so the session and CSRF cookies work as in dev (Vite proxy).
server {
    listen 80;
    server_tokens off;
    client_max_body_size 15m;  # attachments are capped at 10 MB by Django (ATTACHMENT_MAX_BYTES)

    root /usr/share/nginx/html;

    # /media/ too: Django checks the record's permission and office (config/media.py), then hands the file back
    # through /protected-media/ below (X-Accel-Redirect). Django sets its own security headers on these responses.
    location ~ ^/(api|admin|media)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Coolify's proxy terminates HTTPS; pass its scheme on so Django knows the request was secure.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
    }

    # Only reachable from an X-Accel-Redirect sent by Django, never from a browser.
    location /protected-media/ {
        internal;
        alias /srv/media/;
        add_header X-Content-Type-Options nosniff;
    }

    # Django admin/DRF static files, from a volume shared with the backend.
    location /static/ { alias /srv/static/; expires 7d; include /etc/nginx/snippets/security-headers.conf; }

    # Vite's hashed bundles never change; index.html must always be fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
